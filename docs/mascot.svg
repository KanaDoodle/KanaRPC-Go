<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 8 456 456" width="512" height="512"
     role="img" aria-label="KanaRPC 蓝色大肥鱼吉祥物">
  <title>KanaRPC 蓝色大肥鱼</title>
  <defs>
    <linearGradient id="body" x1="0.18" y1="0.06" x2="0.78" y2="0.96">
      <stop offset="0" stop-color="#7FB8FF"/>
      <stop offset="0.5" stop-color="#4A8BF5"/>
      <stop offset="1" stop-color="#2E63D6"/>
    </linearGradient>
    <linearGradient id="fin" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5E9BF8"/>
      <stop offset="1" stop-color="#2A5CC9"/>
    </linearGradient>
  </defs>

  <!-- tail: rounded lobes, tucked close so the silhouette stays readable when small -->
  <path d="M 132 244 C 104 212 98 172 108 148 C 128 176 146 196 164 208
           C 154 224 152 234 154 244 C 152 254 154 264 164 280
           C 146 292 128 312 108 340 C 98 316 104 276 132 244 Z"
        fill="url(#fin)" stroke="#1F4DAE" stroke-width="11"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- dorsal fin -->
  <path d="M 208 128 C 230 86 276 66 318 74 C 308 114 292 142 272 160 Z"
        fill="url(#fin)" stroke="#1F4DAE" stroke-width="11"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- body -->
  <path d="M 148 244 C 148 162 204 116 284 116 C 366 116 428 162 428 244
           C 428 326 366 372 284 372 C 204 372 148 326 148 244 Z"
        fill="url(#body)" stroke="#1F4DAE" stroke-width="12" stroke-linejoin="round"/>

  <!-- lower pectoral fin, on the belly edge like a real fish -->
  <path d="M 310 344 C 324 370 352 386 384 378 C 368 356 352 347 336 343 Z"
        fill="url(#fin)" stroke="#1F4DAE" stroke-width="10"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- eyes: simple, high contrast so they survive 32px -->
  <ellipse cx="256" cy="228" rx="44" ry="48" fill="#FFFFFF" stroke="#1F4DAE" stroke-width="10"/>
  <ellipse cx="352" cy="228" rx="44" ry="48" fill="#FFFFFF" stroke="#1F4DAE" stroke-width="10"/>
  <ellipse cx="261" cy="233" rx="23" ry="26" fill="#16305E"/>
  <ellipse cx="357" cy="233" rx="23" ry="26" fill="#16305E"/>
  <circle cx="252" cy="221" r="10" fill="#FFFFFF"/>
  <circle cx="348" cy="221" r="10" fill="#FFFFFF"/>

  <!-- blush -->
  <ellipse cx="220" cy="292" rx="26" ry="15" fill="#FF9EC0" opacity="0.5"/>
  <ellipse cx="388" cy="292" rx="26" ry="15" fill="#FF9EC0" opacity="0.5"/>

  <!-- smile -->
  <path d="M 282 292 Q 304 318 326 292" fill="none" stroke="#16305E"
        stroke-width="11" stroke-linecap="round"/>
</svg>
